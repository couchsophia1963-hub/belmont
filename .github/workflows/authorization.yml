name: API authorization

# The check that answers "who is allowed to do what" and fails when the code stops
# matching the written answer. See docs/api-authorization.md.
#
# It parses supabase/functions/api/index.ts and supabase/migrations/*.sql as text,
# so there is nothing to install and nothing to build. A new mutating action with no
# row in the authorization spec fails here.
#
# The api-of-record contract names this file as the mechanical authority for the code
# facts, which is why it runs on every pull request rather than on demand.

on:
  pull_request:
  push:
    branches: [main]

# Read-only. This workflow checks out the repository and runs node. It needs nothing
# else, and saying so explicitly is cheaper than discovering otherwise.
permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA rather than a tag: a tag is mutable, so `checkout@v4`
      # is whatever the tag points at when the workflow runs. The tag is in the comment
      # so the pin can be bumped deliberately. Both are v4.4.0, read from each
      # repository's tag list.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Check the code against the authorization table
        run: node scripts/check-api-authorization.mjs