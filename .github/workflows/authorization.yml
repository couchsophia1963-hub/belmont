name: API authorization

# The check that answers "who is allowed to do what" and fails when the code stops
# matching the written answer. See docs/api-authorization.md.
#
# It parses supabase/functions/api/index.ts and supabase/migrations/*.sql as text,
# so there is nothing to install and nothing to build. A new mutating action with no
# row in the authorization spec fails here.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the code against the authorization table
        run: node scripts/check-api-authorization.mjs