name: CI

# BEL-141. Nothing in this repo ran on a push before this workflow: `main` had
# six merged PRs and no job had ever executed. A required check that has never
# run is not a check, so this runs on every pull request and on a push to main.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run already in flight. Without this,
# a PR that is pushed five times queues five builds and the oldest, least
# relevant result can be the last one to report.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `NODE_ENV` is pinned once, at the workflow level, so it reaches every step
# including `npm ci`. Two distinct failures come from inheriting it from the
# runner, and the larger one starts at install rather than at test:
#
#   1. `npm ci` under NODE_ENV=production drops devDependencies. Verified
#      against this lockfile: 356 packages removed, including vitest,
#      typescript, eslint, jsdom and @testing-library. On a cold runner that is
#      `tsc: not found`, `eslint: not found`, `vitest: not found`, so the job
#      cannot run any of its first three gates.
#   2. Even with a warm node_modules, React resolves to its production bundle
#      under NODE_ENV=production, where `act` is a no-op, and every test that
#      renders a component fails with "act(...) is not supported in production
#      builds of React".
#
# GitHub-hosted runners default to unset, so the job is green either way today.
# That is the problem rather than the comfort: a gate that passes for the wrong
# reason reports coverage it is not providing. Pinning it makes the result a
# function of the commit instead of a function of the machine.
#
# This is top-level `env` and not `jobs.<id>.defaults.run.env` on purpose. The
# latter is not valid workflow schema -- `defaults.run` accepts only `shell` and
# `working-directory` -- and GitHub rejects the whole file over it. A per-step
# `env:` on the Test step alone would also be wrong, because failure (1) starts
# at `npm ci` and that step would still inherit the runner's value.
env:
  NODE_ENV: test

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the lockfile, so `npm ci` resolves the same tree locally and
          # in CI. The runner image ships its own Node, and `package.json` pins no
          # `engines`, so this is the only statement of which Node is correct.
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly what the lockfile says and fails if the two
      # disagree. `npm install` would quietly update the lockfile and let a PR
      # pass on packages nobody reviewed.
      - name: Install dependencies
        run: npm ci

      # The build runs last on purpose. It is the slowest step and the one most
      # likely to fail for a reason the earlier steps already explain, so a
      # reviewer reading a red run finds the root cause first instead of last.
      # Each of these is a gate on its own; `npm run build` does not imply the
      # other three pass.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No network and no database: the test suite mocks `@/lib/supabase`, so a
      # green run says the routes and URL helpers are right, not that Supabase
      # happened to be reachable at that moment.
      - name: Test
        run: npm test

      # BEL-308. This proves the build-env gate itself, with no credential and
      # no outbound call, on every push and every PR.
      #
      # It runs against the two cases the gate exists for, and both are cases
      # `vite build` accepts today: variables that are absent, and a key issued
      # for the wrong project. Each is asserted to FAIL the gate. A gate that
      # has never been seen to fail is a gate whose value is unknown, which is
      # how the presence-only bash loop it replaces survived.
      - name: The build-env gate rejects what a green build accepts
        run: |
          set -e
          fail_if_passed() {
            if node scripts/build-env.mjs; then
              echo "::error::the build-env gate passed a build it must reject: $1"
              exit 1
            fi
            echo "  correctly rejected: $1"
          }
          fail_if_passed "absent Supabase variables"
          fail_if_passed "a key issued for another project (BEL-82)"

      # The same gate, against the values CI builds with. These are deliberate
      # placeholders, so this step is expected to FAIL and is not a gate on
      # this PR: it exists to show in the log that the placeholders would not
      # reach a real deploy. `continue-on-error` is what keeps it from doing so.
      #
      # Once the secrets are in place this step becomes a real gate and the
      # `continue-on-error` below is deleted in the same change that sets them.
      - name: The gate would refuse the placeholder build values
        continue-on-error: true
        run: npm run build-env
        env:
          VITE_SUPABASE_URL: https://placeholder.invalid
          VITE_SUPABASE_ANON_KEY: placeholder-not-a-real-key

      # The app reads VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY at module load.
      # They are placeholders, never real credentials: the anon key is a public
      # value by design, but nothing from the secret store is placed in a workflow
      # file. `npm run build` does not need a reachable project, and the test
      # suite does not read them.
      #
      # `prebuild` runs `build-env` first, which would reject these placeholders
      # and fail this step for the wrong reason. The build itself is what CI is
      # checking here -- that the bundle compiles -- so it runs `vite build`
      # directly and the gate is asserted separately above.
      - name: Build
        run: npx vite build
        env:
          VITE_SUPABASE_URL: https://placeholder.invalid
          VITE_SUPABASE_ANON_KEY: placeholder-not-a-real-key